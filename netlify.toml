[build]
  # npm optionalDeps bug on cross-OS lockfiles (npm/cli#4828): force Linux natives.
  command = "npm install --include=optional @tailwindcss/oxide-linux-x64-gnu@4.3.3 lightningcss-linux-x64-gnu@1.33.0 && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=optional"

[[headers]]
  for = "/karta-zgloszenia-dziecka.pdf"
  [headers.values]
    Content-Disposition = "attachment; filename=\"karta-zgloszenia-dziecka.pdf\""
